[package]
name = "chassis"
version = "0.1.0"
description = "Shared foundation for Kenny's Rust web services: configuration, logging, health, metrics, shutdown, dashboard, self-update and notifications behind feature flags"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# `core` is always on; the others are opt-in (T2). `passkeys` implies
# `dashboard` because a passkey without a login page has nowhere to live,
# and it is separate because it pulls OpenSSL through webauthn-rs (T8).
default = ["core"]
core = []
dashboard = ["core"]
passkeys = ["dashboard"]
self-update = ["core"]
notify = ["core"]

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
secrecy = { workspace = true }
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
tower-http = { version = "0.7", features = ["request-id", "limit", "timeout", "trace"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
sd-notify = "0.5"
subtle = "2"
hex = "0.4"
getrandom = "0.3"

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
