[package]
name = "chassis"
version = "1.7.1"
description = "Shared foundation for Kenny's Rust web services: configuration, logging, health, metrics, shutdown, dashboard, self-update and notifications behind feature flags"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# `core` is always on; the others are opt-in (T2). `passkeys` implies
# `dashboard` because a passkey without a login page has nowhere to live,
# and it is separate because it pulls OpenSSL through webauthn-rs (T8).
default = ["core"]
core = []
# The vendored kp-themes files and fonts, for a project that keeps its own
# dashboard under the kit's CSP (kyu, Almanac); `dashboard` implies it.
assets = ["core"]
dashboard = ["core", "assets"]
passkeys = ["dashboard", "dep:webauthn-rs"]
self-update = ["core", "dep:minisign-verify", "dep:backon"]
notify = ["core", "dep:backon"]
# K25: the in-process test harness (`chassis::testing`), for a project's
# dev-dependencies. Implies `dashboard` because logging in and issuing a
# client are what it wraps; `minisign` signs the fake release server's
# manifests when `self-update` is on as well.
testing = ["dashboard", "dep:tempfile", "dep:minisign"]

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
secrecy = { workspace = true }
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
tower-http = { version = "0.7", features = ["request-id", "limit", "timeout", "trace"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
sd-notify = "0.5"
subtle = "2"
hex = "0.4"
getrandom = "0.3"
# L2: metrics facade + Prometheus exporter (K7), keyed rate limiting (K10),
# HTTP client for --healthcheck (K7) and, later, updates and webhooks.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
governor = "0.10"
reqwest = { workspace = true }
# L3: encrypted stores, sessions, clients (K8, K12, K13, AR5, AR6)
chacha20poly1305 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
axum-extra = { version = "0.12", features = ["cookie"] }
# cookie lifetimes are `time::Duration` in the cookie crate
time = "0.3"
# L4: server-rendered dashboard (K15, K16, K17)
minijinja = { version = "2", features = ["json"] }
# K9: passkeys (WebAuthn server side); pulls OpenSSL, hence its own feature (T8).
# `danger-allow-state-serialisation` lets the ceremony state live in the
# kit's own bounded map with a TTL instead of an opaque in-memory type.
webauthn-rs = { version = "0.5", optional = true }

# L5: signed self-update (K18–K21) and the notifier (K22)
minisign-verify = { version = "0.2", optional = true }
backon = { version = "1", optional = true }

# K25: `chassis::testing` (feature `testing`) needs a temp dir and a signer;
# both stay dev-dependencies below for the kit's own unit tests.
tempfile = { workspace = true, optional = true }
minisign = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# Paused-clock tests of the update loop (K18).
tokio = { workspace = true, features = ["test-util"] }
# Tests sign their own fake releases; production only ever verifies.
minisign = "0.9"

[lints.rust]
unsafe_code = "forbid"
