[package]
name = "chassis"
version = "0.1.0"
description = "Shared foundation for Kenny's Rust web services: configuration, logging, health, metrics, shutdown, dashboard, self-update and notifications behind feature flags"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# `core` is always on; the others are opt-in (T2). `passkeys` implies
# `dashboard` because a passkey without a login page has nowhere to live,
# and it is separate because it pulls OpenSSL through webauthn-rs (T8).
default = ["core"]
core = []
dashboard = ["core"]
passkeys = ["dashboard", "dep:webauthn-rs"]
self-update = ["core"]
notify = ["core"]

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
secrecy = { workspace = true }
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
tower-http = { version = "0.7", features = ["request-id", "limit", "timeout", "trace"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
sd-notify = "0.5"
subtle = "2"
hex = "0.4"
getrandom = "0.3"
# L2: metrics facade + Prometheus exporter (K7), keyed rate limiting (K10),
# HTTP client for --healthcheck (K7) and, later, updates and webhooks.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
governor = "0.10"
reqwest = { workspace = true }
# L3: encrypted stores, sessions, clients (K8, K12, K13, AR5, AR6)
chacha20poly1305 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
axum-extra = { version = "0.12", features = ["cookie"] }
# cookie lifetimes are `time::Duration` in the cookie crate
time = "0.3"
# L4: server-rendered dashboard (K15, K16, K17)
minijinja = { version = "2", features = ["json"] }
# K9: passkeys (WebAuthn server side); pulls OpenSSL, hence its own feature (T8).
# `danger-allow-state-serialisation` lets the ceremony state live in the
# kit's own bounded map with a TTL instead of an opaque in-memory type.
webauthn-rs = { version = "0.5", optional = true, features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
