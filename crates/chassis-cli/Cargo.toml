[package]
name = "chassis-cli"
version = "1.7.1"
description = "The `chassis` command: scaffold a new service, sync an existing one against the current scaffold, cut a signed release"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "chassis"
path = "src/main.rs"

[dependencies]
# The kit's error type (remedy mandatory) and its constants; core only.
chassis = { path = "../chassis", version = "1.7.1", default-features = false, features = ["core"] }
clap = { workspace = true }
minijinja = { version = "2", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Unified diffs for `sync`.
similar = "2"
# `clients` (K30) drives a service's /api/clients over HTTP; the workspace
# entry keeps reqwest at one version across the tree, `blocking` because
# the CLI has no runtime of its own.
reqwest = { workspace = true, features = ["blocking"] }
# The admin token is held as a secret so no Debug or log line can print it.
secrecy = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The `clients` E2E starts a real service in-process (K30).
chassis = { path = "../chassis", version = "1.7.1", features = ["dashboard"] }
tokio = { workspace = true }
axum = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
