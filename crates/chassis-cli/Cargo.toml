[package]
name = "chassis-cli"
version = "1.0.0"
description = "The `chassis` command: scaffold a new service, sync an existing one against the current scaffold, cut a signed release"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "chassis"
path = "src/main.rs"

[dependencies]
# The kit's error type (remedy mandatory) and its constants; core only.
chassis = { path = "../chassis", version = "1.0.0", default-features = false, features = ["core"] }
clap = { workspace = true }
minijinja = { version = "2", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Unified diffs for `sync`.
similar = "2"

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
