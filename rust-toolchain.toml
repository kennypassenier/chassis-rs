# The one Rust this project builds with, in the commit gates and in
# scripts/release-kit.sh (T1; CI until 3.0.0). Without this file a machine
# takes whatever "stable" is that day, and a gate that passes on one machine
# refuses a commit on another over a lint the first clippy does not have
# (kyu, 2026-08-28). A gate that does not predict the build is not a gate
# (standing rule 7).
#
# Raising it is a deliberate act: bump the channel here and
# `rust-version` in Cargo.toml together, run the gates, and fix what the
# newer clippy has learned to complain about.
[toolchain]
channel = "1.97"
components = ["rustfmt", "clippy"]
