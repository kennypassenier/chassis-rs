[package]
name = "inbox"
version = "0.1.0"
description = "Example service on chassis: clients post JSON messages, the dashboard lists them (K26)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The version beside the path is what cargo-deny's wildcard ban asks for
# (L0 CI run 33949831302 failed without it).
chassis = { path = "../../crates/chassis", version = "1.1.0", features = ["dashboard", "passkeys", "self-update", "notify"] }
tokio = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking", "cookies"] }
tempfile = { workspace = true }
# The update E2E signs a fake release with a throwaway key to prove the
# binary trusts only the compiled-in one.
minisign = "0.9"
sha2 = "0.10"
hex = "0.4"
