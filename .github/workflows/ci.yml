name: CI

# Runs on every branch (standing rule 6a): branch protection waits for
# these checks, and a branch push that produced no checks could never be
# merged without a pull request. Measured on 2026-09-09, the evening the
# trigger was narrowed to `main`: a branch push produced zero checks, the
# push to main was refused with "Required status check … is expected", and
# a manually dispatched run did not satisfy it either — a check from
# another branch's context does not count for main. Kenny chose to restore
# this on 2026-09-10; what that change was really after, one CI job instead
# of two, stays in place.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# S7: the CI token only reads; publishing happens in release.yml.
permissions:
  contents: read

jobs:
  gates:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          # The same version rust-toolchain.toml pins (standing rule 7).
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # CF-6: the scaffold E2E runs cargo-deny on the generated project.
      - uses: taiki-e/install-action@4e14a60b36eb62630dcc25614f0be0659ab8830c # v2
        with:
          tool: cargo-deny
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Walking-skeleton smoke (L0)
        run: |
          cargo run -q -p chassis-cli -- --version
          cargo run -q -p inbox -- --version
