name: CI

# Runs on every branch (standing rule 6a): branch protection waits for
# these checks, and a branch push that produced no checks could never be
# merged without a pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# S7: the CI token only reads; publishing happens in release.yml.
permissions:
  contents: read

jobs:
  gates:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          # The same version rust-toolchain.toml pins (standing rule 7).
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # CF-6: the scaffold E2E runs cargo-deny on the generated project.
      - uses: taiki-e/install-action@4e14a60b36eb62630dcc25614f0be0659ab8830c # v2
        with:
          tool: cargo-deny
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Walking-skeleton smoke (L0)
        run: |
          cargo run -q -p chassis-cli -- --version
          cargo run -q -p inbox -- --version

  deny:
    name: cargo-deny (advisories · licenses · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    # Informational on purpose (Phase 7): a coverage percentage is a hint
    # about where to look, not a quality gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          toolchain: "1.97"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@4e14a60b36eb62630dcc25614f0be0659ab8830c # cargo-llvm-cov
      - name: Measure coverage
        run: cargo llvm-cov --workspace --all-features --summary-only
