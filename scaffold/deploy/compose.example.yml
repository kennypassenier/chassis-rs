# Running the image with docker compose (T7: self-update is off inside an
# image by detection; updates are a new image). The logging block is the
# rotation for the container's stdout (H4); without it the json-file driver
# grows without bound.
services:
  {{ name }}:
    image: ghcr.io/{{ repo }}:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    # {{ prefix }}_PUBLIC_URL is not in this list: it is a passkeys knob, and
    # the scaffold builds without that feature (feat-build-1).
    env_file: /etc/{{ name }}/{{ name }}.env   # {{ prefix }}_TOKEN, {{ prefix }}_SECRET_KEY
    volumes:
      - {{ name }}-state:/var/lib/{{ name }}    # a named volume inherits the image's owner
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  {{ name }}-state:
