# Dependency policy (T4: pragmatic, policed). Checked in CI on every push
# and again weekly, because advisories move without our code moving.

[advisories]
yanked = "deny"

[licenses]
# chassis is MIT OR Apache-2.0 (T5); dependencies must be permissive.
# MPL-2.0 is on the list for webauthn-rs (T3). A copyleft dependency is a
# decision, not an accident: adding one means editing this list in a
# reviewed commit.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions of one crate mean two copies compiled in; at this
# project's dependency count that is a smell worth seeing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
